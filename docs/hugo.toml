baseURL = "https://brandonwhitmire.github.io/test-net/"
title = "test-net"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS", "section"]

[languages]
  [languages.en]
    locale = "en-US"
    weight = 1

[params]
  description = "Local libvirt/KVM pentest lab — Vagrant + Ansible"

[markup.goldmark.renderer]
  unsafe = true

# Single source of truth: repo-root README.md is the site.
[module]
  [[module.mounts]]
    source = "../README.md"
    target = "content/_index.md"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
