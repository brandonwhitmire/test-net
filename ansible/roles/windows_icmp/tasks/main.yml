---
# Allow host ping checks against Windows guests (default FW blocks ICMP).
- name: Allow ICMPv4 echo request inbound
  community.windows.win_firewall_rule:
    name: Lab ICMPv4 echo request
    description: Allow ping from lab host for Stage 1 health checks
    direction: in
    action: allow
    protocol: icmpv4
    icmp_type_code:
      - "8:*"
    profiles:
      - domain
      - private
      - public
    enabled: true
    state: present
