---
# Standalone inventory — re-run playbooks without Vagrant:
#   cd ansible && ansible-playbook playbooks/site.yml
#   cd ansible && ansible-playbook playbooks/health.yml

all:
  children:
    domain_controllers:
      hosts:
        dc:
          ansible_host: 10.0.0.10
          ansible_connection: winrm
          ansible_winrm_transport: basic
          ansible_winrm_server_cert_validation: ignore
          ansible_port: 5985
          ansible_user: vagrant
          ansible_password: vagrant

    linux:
      hosts:
        linux01:
          ansible_host: 10.0.0.20
          ansible_user: vagrant
          ansible_python_interpreter: /usr/bin/python3

    workstations:
      hosts:
        ws01:
          ansible_host: 10.0.0.30
          ansible_connection: winrm
          ansible_winrm_transport: basic
          ansible_winrm_server_cert_validation: ignore
          ansible_port: 5985
          ansible_user: vagrant
          ansible_password: vagrant

    # External attacker — not in site.yml / domain / logging
    attackers:
      hosts:
        kali:
          ansible_host: 10.0.0.50
          ansible_user: vagrant
          ansible_python_interpreter: /usr/bin/python3
          # Packer box uses the public Vagrant insecure key (not a per-machine key)
          ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.vagrant.d/insecure_private_keys/vagrant.key.ed25519"
          ansible_ssh_common_args: "-o IdentitiesOnly=yes"
